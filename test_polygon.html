<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Polygon Construct</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
    <style>
        #cy { width: 100%; height: 100vh; border: 2px solid #333; }
    </style>
</head>
<body>
    <div id="cy"></div>
    <script>
        const cy = cytoscape({
            container: document.getElementById('cy'),
            style: [
                { selector: 'node', style: { 'background-color': '#666', 'label': 'data(id)', 'text-valign': 'center' } },
                { selector: 'edge', style: { 'width': 2, 'line-color': '#999' } }
            ]
        });

        const vertices = [
            {x:200,y:0},{x:100,y:173.2},{x:-100,y:173.2},
            {x:-200,y:0},{x:-100,y:-173.2},{x:100,y:-173.2}
        ];
        const sourceVertex = 3;

        cy.polygonConstruct({
            vertices: vertices,
            vertexRadius: 22,
            verticesCount: 20,
            sourceVertex: sourceVertex,
            edge: true,
            layoutAnimation: false
        });
    </script>
</body>
</html>
